
name: SmartCI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Dynamic Test-Subset Routing
      - name: Detect changed files
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cart:
              - 'src/cart.py'
              - 'tests/test_cart.py'
            inventory:
              - 'src/inventory.py'
              - 'tests/test_inventory.py'
            pricing:
              - 'src/pricing.py'
              - 'tests/test_pricing.py'
            shared:
              - 'src/__init__.py'
              - 'tests/conftest.py'
              - 'requirements.txt'
              - 'pytest.ini'
              - '.github/workflows/**'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Smart Build Cache
      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run all tests for shared changes
      - name: Run all tests
        if: steps.changes.outputs.shared == 'true'
        run: python -m pytest -v

      # Run only relevant test subsets
      - name: Run Cart tests
        if: steps.changes.outputs.shared != 'true' && steps.changes.outputs.cart == 'true'
        run: python -m pytest tests/test_cart.py -v

      - name: Run Inventory tests
        if: steps.changes.outputs.shared != 'true' && steps.changes.outputs.inventory == 'true'
        run: python -m pytest tests/test_inventory.py -v

      - name: Run Pricing tests
        if: steps.changes.outputs.shared != 'true' && steps.changes.outputs.pricing == 'true'
        run: python -m pytest tests/test_pricing.py -v

      - name: No relevant tests detected
        if: >-
          steps.changes.outputs.shared != 'true' &&
          steps.changes.outputs.cart != 'true' &&
          steps.changes.outputs.inventory != 'true' &&
          steps.changes.outputs.pricing != 'true'
        run: echo "No relevant source or test changes detected. Skipping tests."

      # Gemini AI Build Log Summarization
      - name: Capture test logs
        if: always()
        run: python -m pytest -v > build.log 2>&1 || true

      - name: Summarize build logs with Gemini
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/summarize_logs.py

      # Machine Learning Build-Failure Prediction
      - name: Train Build Failure Prediction Model
        if: always()
        run: python ml/train_model.py

      - name: Predict Build Failure
        if: always()
        run: python ml/predict_build.py
